[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobiletrace-ai"
version = "1.0.0"
description = "Mobile digital forensics workstation for authorized Android and iOS device acquisition, SHA-256 verification, timeline analysis, and evidence-backed reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13.1",
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.1",
  "reportlab>=4.2.0",
]

[project.scripts]
mobiletrace = "mobiletrace.app:main"
mobiletrace-cli = "mobiletrace.cli:main"

[tool.setuptools.packages.find]
include = ["mobiletrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
